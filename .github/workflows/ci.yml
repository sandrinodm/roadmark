name: Verify roadmap
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install --global pnpm@12.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @roadmark/web exec e2e-web install chromium --with-deps
      - run: pnpm ready
      - run: pnpm test:package
      - run: pnpm benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: ai-sandbox-roadmap
          path: dist/
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-reports
          path: packages/web/.e2e/
          include-hidden-files: true
