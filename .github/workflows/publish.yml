name: Publish

# Only a published GitHub release starts a publish. The tag's commit must already have passed CI on
# main, and the maintainer approves the npm environment before anything reaches the registry.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  # An exact Node version whose bundled npm (11.20.0) supports trusted publishing. The publish job
  # uses this npm as is and never installs anything.
  NODE_VERSION: 26.13.1
  TARBALL: package.tgz

jobs:
  check:
    name: Check the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the package version and is not a prerelease
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          test "$TAG" = "v$version" || { echo "Tag $TAG does not match apps/cli version $version"; exit 1; }
          test "$PRERELEASE" = "false" || { echo "Prereleases are not published"; exit 1; }

  build:
    name: Build and pack
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - id: pack
        run: |
          pnpm --filter roadmark pack --out "$GITHUB_WORKSPACE/$TARBALL"
          echo "sha256=$(sha256sum "$TARBALL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # Upload straight after packing, before anything else can touch the file.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ env.TARBALL }}
          retention-days: 45
          if-no-files-found: error

  smoke:
    name: Install and run the tarball
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - run: pnpm --filter roadmark test:package "$RUNNER_TEMP/package/$TARBALL"

  publish:
    name: Publish to npm
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Verify the tarball is the one the build job packed
        env:
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: echo "$EXPECTED  $TARBALL" | sha256sum --check
      - run: npm publish "./$TARBALL" --provenance --ignore-scripts --access public
